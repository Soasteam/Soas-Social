<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SOAS - CV Operatore</title>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#080b0a url("sfondo-cv.jpeg") center/cover fixed;
    color:#fff;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    z-index:-1;
}

.container{
    width:95%;
    max-width:900px;
    margin:30px auto;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    margin:0;
    font-size:32px;
    letter-spacing:4px;
    color:#d7ff00;
}

.header p{
    margin-top:8px;
    color:#aaa;
    letter-spacing:2px;
}

.card{
    background:rgba(12,15,14,.95);
    border:1px solid #384038;
    border-radius:12px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.section-title{
    color:#d7ff00;
    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;
    border-bottom:1px solid #424942;
    padding-bottom:10px;
    margin-bottom:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field.full{
    grid-column:1/-1;
}

label{
    font-size:12px;
    color:#aaa;
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:1px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border-radius:7px;
    border:1px solid #444b44;
    background:#171b18;
    color:#fff;
    font-size:14px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#d7ff00;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.roles{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.role{
    background:#171b18;
    border:1px solid #444b44;
    padding:10px;
    border-radius:7px;
}

.role label{
    display:flex;
    align-items:center;
    gap:7px;
    margin:0;
    cursor:pointer;
    color:#ddd;
}

.role input{
    width:auto;
}

.photo-area{
    text-align:center;
    margin-bottom:20px;
}

.photo-preview{
    width:150px;
    height:180px;
    margin:0 auto 12px;
    border:2px dashed #555;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111;
    overflow:hidden;
    color:#777;
    font-size:14px;
}

.photo-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:20px;
}

button{
    border:0;
    border-radius:8px;
    padding:14px 20px;
    font-weight:bold;
    letter-spacing:1px;
    cursor:pointer;
    transition:.2s;
}

.generate{
    background:#d7ff00;
    color:#111;
    flex:1;
}

.pdf{
    background:#222;
    color:#d7ff00;
    border:1px solid #d7ff00;
    flex:1;
}

button:hover{
    transform:translateY(-2px);
    filter:brightness(1.1);
}

#cvCard{
    display:none;
}

.cv-header{
    display:flex;
    gap:20px;
    align-items:center;
    border-bottom:2px solid #d7ff00;
    padding-bottom:18px;
    margin-bottom:20px;
}

.cv-photo{
    width:120px;
    height:145px;
    border:2px solid #d7ff00;
    object-fit:cover;
    background:#111;
}

.cv-title h2{
    margin:0 0 7px;
    color:#d7ff00;
    font-size:26px;
}

.cv-title p{
    margin:4px 0;
    color:#aaa;
}

.cv-block{
    margin-bottom:18px;
}

.cv-block h3{
    color:#d7ff00;
    font-size:15px;
    border-bottom:1px solid #333;
    padding-bottom:6px;
    margin-bottom:9px;
}

.cv-block p{
    margin:5px 0;
    line-height:1.5;
    color:#ddd;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.badge{
    border:1px solid #657000;
    color:#d7ff00;
    background:#181d10;
    padding:6px 9px;
    border-radius:5px;
    font-size:12px;
}

.whatsapp{
    color:#6cff8b;
}

@media(max-width:650px){

    .grid{
        grid-template-columns:1fr;
    }

    .roles{
        grid-template-columns:1fr 1fr;
    }

    .cv-header{
        flex-direction:column;
        text-align:center;
    }

}

</style>
</head>

<script>

let photoData = "";


/* FOTO */

document.getElementById("photo").addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        photoData = e.target.result;

        document.getElementById("photoPreview").innerHTML =
            '<img src="' + photoData + '" alt="Foto operatore">';

    };

    reader.readAsDataURL(file);

});


/* GENERAZIONE CV */

function generaCV(){

    const nome =
        document.getElementById("nome").value.trim();

    const cognome =
        document.getElementById("cognome").value.trim();

    const nickname =
        document.getElementById("nickname").value.trim();

    const eta =
        document.getElementById("eta").value.trim();

    const provincia =
        document.getElementById("provincia").value.trim();

    const citta =
        document.getElementById("citta").value.trim();

    const anni =
        document.getElementById("anni").value.trim();

    const squadra =
        document.getElementById("squadra").value.trim();

    const esperienze =
        document.getElementById("esperienze").value.trim();

    const equipaggiamento =
        document.getElementById("equipaggiamento").value.trim();

    const disponibilita =
        document.getElementById("disponibilita").value;

    const trasferte =
        document.getElementById("trasferte").value;

    const whatsapp =
        document.getElementById("whatsapp").value.trim();

    const presentazione =
        document.getElementById("presentazione").value.trim();


    /* RUOLI */

    const checkedRoles =
        document.querySelectorAll(
            '.role input[type="checkbox"]:checked'
        );

    const roles = [];

    checkedRoles.forEach(function(item){
        roles.push(item.value);
    });


    /* DATI */

    document.getElementById("cvName").textContent =
        (nome + " " + cognome).trim() || "OPERATORE SOAS";

    document.getElementById("cvNickname").textContent =
        nickname ? "CALLSIGN: " + nickname : "";

    let locationText = "";

    if(citta){
        locationText += citta;
    }

    if(provincia){
        if(locationText){
            locationText += " - ";
        }

        locationText += provincia;
    }

    if(eta){
        if(locationText){
            locationText += " | ";
        }

        locationText += "Età: " + eta;
    }

    document.getElementById("cvLocation").textContent =
        locationText;


    document.getElementById("cvExperience").textContent =
        "Anni di esperienza: " + (anni || "Non specificato");


    document.getElementById("cvTeam").textContent =
        "Squadra attuale: " + (squadra || "Non specificata");


    document.getElementById("cvPrevious").textContent =
        "Esperienze precedenti: " +
        (esperienze || "Nessuna esperienza precedente indicata");


    /* RUOLI */

    const rolesContainer =
        document.getElementById("cvRoles");

    rolesContainer.innerHTML = "";

    if(roles.length === 0){

        rolesContainer.innerHTML =
            '<span class="badge">Nessun ruolo indicato</span>';

    }else{

        roles.forEach(function(role){

            const badge =
                document.createElement("span");

            badge.className = "badge";

            badge.textContent = role;

            rolesContainer.appendChild(badge);

        });

    }


    /* COMPETENZE */

    const skills = [
        "Tiro: " + document.getElementById("tiro").value,
        "Movimento tattico: " + document.getElementById("movimento").value,
        "CQB: " + document.getElementById("cqb").value,
        "Radio: " + document.getElementById("radio").value,
        "Navigazione: " + document.getElementById("navigazione").value,
        "Primo soccorso: " + document.getElementById("soccorso").value
    ];

    document.getElementById("cvSkills").textContent =
        skills.join(" | ");


    document.getElementById("cvEquipment").textContent =
        equipaggiamento || "Non specificato";


    document.getElementById("cvAvailability").textContent =
        "Disponibilità: " + disponibilita;


    document.getElementById("cvTravel").textContent =
        "Trasferte: " + trasferte;


    document.getElementById("cvPresentation").textContent =
        presentazione || "Nessuna presentazione inserita";


    document.getElementById("cvWhatsapp").textContent =
        whatsapp || "Numero WhatsApp non inserito";


    /* FOTO */

    const cvPhoto =
        document.getElementById("cvPhoto");

    if(photoData){

        cvPhoto.src = photoData;

    }else{

        cvPhoto.removeAttribute("src");

        cvPhoto.style.background = "#111";

        cvPhoto.alt = "Nessuna foto";

    }


    /* MOSTRA CV */

    const cvCard =
        document.getElementById("cvCard");

    cvCard.style.display = "block";

    cvCard.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}


/* ============================
   PDF DIRETTO CON jsPDF
   ============================ */

async function scaricaPDF(){

    if(typeof window.jspdf === "undefined"){

        alert(
            "Impossibile caricare il sistema PDF. Controlla la connessione internet e riprova."
        );

        return;
    }


    const {
        jsPDF
    } = window.jspdf;


    const pdf =
        new jsPDF({
            orientation:"portrait",
            unit:"mm",
            format:"a4"
        });


    const pageWidth =
        pdf.internal.pageSize.getWidth();

    const pageHeight =
        pdf.internal.pageSize.getHeight();


    /* SFONDO */

    pdf.setFillColor(12,15,14);

    pdf.rect(
        0,
        0,
        pageWidth,
        pageHeight,
        "F"
    );


    /* BORDO TATTICO */

    pdf.setDrawColor(215,255,0);

    pdf.setLineWidth(0.7);

    pdf.rect(
        8,
        8,
        pageWidth - 16,
        pageHeight - 16
    );


    /* HEADER */

    pdf.setTextColor(215,255,0);

    pdf.setFont("helvetica","bold");

    pdf.setFontSize(20);

    pdf.text(
        "SOAS AIR SOFT TEAM",
        pageWidth / 2,
        20,
        {
            align:"center"
        }
    );


    pdf.setFontSize(9);

    pdf.setTextColor(170,170,170);

    pdf.text(
        "TACTICAL OPERATOR CV",
        pageWidth / 2,
        27,
        {
            align:"center"
        }
    );


    /* LINEA */

    pdf.setDrawColor(215,255,0);

    pdf.setLineWidth(0.4);

    pdf.line(
        15,
        31,
        pageWidth - 15,
        31
    );


    let y = 40;


    /* FOTO OPERATORE */

    if(photoData){

        try{

            const imgProps =
                pdf.getImageProperties(photoData);

            const maxW = 38;
            const maxH = 48;

            let imgW = maxW;

            let imgH =
                (imgProps.height / imgProps.width) * imgW;

            if(imgH > maxH){

                imgH = maxH;

                imgW =
                    (imgProps.width / imgProps.height) * imgH;

            }

            pdf.addImage(
                photoData,
                "JPEG",
                15,
                y,
                imgW,
                imgH
            );

        }catch(error){

            console.log(
                "Foto non inserita nel PDF",
                error
            );

        }

    }else{

        pdf.setDrawColor(90,90,90);

        pdf.rect(
            15,
            y,
            38,
            48
        );

        pdf.setFontSize(8);

        pdf.setTextColor(120,120,120);

        pdf.text(
            "NO FOTO",
            34,
            y + 25,
            {
                align:"center"
            }
        );

    }


    /* NOME */

    const nome =
        (
            document.getElementById("nome").value +
            " " +
            document.getElementById("cognome").value
        ).trim() || "OPERATORE SOAS";


    const nickname =
        document.getElementById("nickname").value.trim();

    const eta =
        document.getElementById("eta").value.trim();

    const citta =
        document.getElementById("citta").value.trim();

    const provincia =
        document.getElementById("provincia").value.trim();


    const infoX = 60;


    pdf.setFont("helvetica","bold");

    pdf.setFontSize(17);

    pdf.setTextColor(255,255,255);

    pdf.text(
        nome,
        infoX,
        y + 10
    );


    pdf.setFont("helvetica","normal");

    pdf.setFontSize(10);

    pdf.setTextColor(215,255,0);

    if(nickname){

        pdf.text(
            "CALLSIGN: " + nickname,
            infoX,
            y + 18
        );

    }


    pdf.setTextColor(180,180,180);

    let infoLine = "";

    if(citta){
        infoLine += citta;
    }

    if(provincia){

        if(infoLine){
            infoLine += " - ";
        }

        infoLine += provincia;

    }

    if(eta){

        if(infoLine){
            infoLine += " | ";
        }

        infoLine += "Età: " + eta;

    }

    if(infoLine){

        pdf.text(
            infoLine,
            infoX,
            y + 26
        );

    }


    y += 58;


    /* FUNZIONE SEZIONE */

    function sectionTitle(title){

        pdf.setFillColor(28,34,28);

        pdf.rect(
            15,
            y - 5,
            pageWidth - 30,
            8,
            "F"
        );

        pdf.setTextColor(215,255,0);

        pdf.setFont("helvetica","bold");

        pdf.setFontSize(10);

        pdf.text(
            title,
            18,
            y + 1
        );

        y += 10;

    }


    /* FUNZIONE TESTO */

    function addText(text){

        if(!text){
            text = "Non specificato";
        }

        pdf.setFont("helvetica","normal");

        pdf.setFontSize(9);

        pdf.setTextColor(225,225,225);

        const lines =
            pdf.splitTextToSize(
                String(text),
                pageWidth - 36
            );

        lines.forEach(function(line){

            if(y > pageHeight - 20){

                pdf.addPage();

                pdf.setFillColor(12,15,14);

                pdf.rect(
                    0,
                    0,
                    pageWidth,
                    pageHeight,
                    "F"
                );

                y = 18;

            }

            pdf.text(
                line,
                18,
                y
            );

            y += 5;

        });

        y += 2;

    }


    /* ESPERIENZA */

    sectionTitle("ESPERIENZA OPERATIVA");


    addText(
        "Anni di esperienza: " +
        (
            document.getElementById("anni").value ||
            "Non specificato"
        )
    );


    addText(
        "Squadra attuale: " +
        (
            document.getElementById("squadra").value ||
            "Non specificata"
        )
    );


    addText(
        "Esperienze precedenti: " +
        (
            document.getElementById("esperienze").value ||
            "Nessuna esperienza indicata"
        )
    );


    /* RUOLI */

    sectionTitle("RUOLI OPERATIVI");


    const checkedRoles =
        document.querySelectorAll(
            '.role input[type="checkbox"]:checked'
        );


    let roleText = [];


    checkedRoles.forEach(function(item){

        roleText.push(item.value);

    });


    addText(
        roleText.length
            ? roleText.join(" | ")
            : "Nessun ruolo indicato"
    );


    /* COMPETENZE */

    sectionTitle("COMPETENZE");


    addText(
        "Tiro: " +
        document.getElementById("tiro").value
    );


    addText(
        "Movimento tattico: " +
        document.getElementById("movimento").value
    );


    addText(
        "CQB: " +
        document.getElementById("cqb").value
    );


    addText(
        "Comunicazioni radio: " +
        document.getElementById("radio").value
    );


    addText(
        "Navigazione: " +
        document.getElementById("navigazione").value
    );


    addText(
        "Primo soccorso: " +
        document.getElementById("soccorso").value
    );


    /* EQUIPAGGIAMENTO */

    sectionTitle("EQUIPAGGIAMENTO");


    addText(
        document.getElementById("equipaggiamento").value ||
        "Non specificato"
    );


    /* DISPONIBILITÀ */

    sectionTitle("DISPONIBILITÀ");


    addText(
        "Disponibilità: " +
        document.getElementById("disponibilita").value
    );


    addText(
        "Trasferte: " +
        document.getElementById("trasferte").value
    );


    /* PRESENTAZIONE */

    sectionTitle("PRESENTAZIONE");


    addText(
        document.getElementById("presentazione").value ||
        "Nessuna presentazione inserita"
    );


    /* CONTATTO */

    sectionTitle("CONTATTO");


    addText(
        "WhatsApp: " +
        (
            document.getElementById("whatsapp").value ||
            "Non inserito"
        )
    );


    /* FOOTER */

    if(y > pageHeight - 25){

        pdf.addPage();

        pdf.setFillColor(12,15,14);

        pdf.rect(
            0,
            0,
            pageWidth,
            pageHeight,
            "F"
        );

        y = 18;

    }


    pdf.setDrawColor(215,255,0);

    pdf.line(
        15,
        pageHeight - 17,
        pageWidth - 15,
        pageHeight - 17
    );


    pdf.setFontSize(7);

    pdf.setTextColor(110,110,110);

    pdf.text(
        "SOAS AIR SOFT TEAM • TACTICAL OPERATOR CV",
        pageWidth / 2,
        pageHeight - 11,
        {
            align:"center"
        }
    );


    /* NOME FILE */

    const safeName =
        nome
            .replace(/[^a-z0-9àèéìòù _-]/gi,"")
            .trim()
            .replace(/\s+/g,"_");


    const filename =
        "SOAS_CV_" +
        (safeName || "OPERATORE") +
        ".pdf";


    /* DOWNLOAD */

    pdf.save(filename);

}

</script>
