<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SOAS - CV Operatore</title>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<style>

/* =========================
   GENERALE
========================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #080b0a
        url("sfondo-cv.jpeg")
        center/cover
        fixed;

    color:#fff;
}

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.78);

    z-index:-1;
}


.container{

    width:95%;

    max-width:900px;

    margin:30px auto;
}


/* =========================
   HEADER
========================= */

.header{

    text-align:center;

    margin-bottom:25px;
}

.header h1{

    margin:0;

    font-size:32px;

    letter-spacing:4px;

    color:#d7ff00;
}

.header p{

    margin-top:8px;

    color:#aaa;

    letter-spacing:2px;
}


/* =========================
   CARD
========================= */

.card{

    background:
        rgba(12,15,14,.96);

    border:
        1px solid #384038;

    border-radius:12px;

    padding:22px;

    margin-bottom:20px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.5);
}


.section-title{

    color:#d7ff00;

    font-size:18px;

    font-weight:bold;

    letter-spacing:2px;

    border-bottom:
        1px solid #424942;

    padding-bottom:10px;

    margin-bottom:18px;
}


/* =========================
   FORM
========================= */

.grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:14px;
}


.field{

    display:flex;

    flex-direction:column;
}


.field.full{

    grid-column:1/-1;
}


label{

    font-size:12px;

    color:#aaa;

    margin-bottom:6px;

    text-transform:uppercase;

    letter-spacing:1px;
}


input,
select,
textarea{

    width:100%;

    padding:12px;

    border-radius:7px;

    border:
        1px solid #444b44;

    background:#171b18;

    color:#fff;

    font-size:14px;

    outline:none;
}


input:focus,
select:focus,
textarea:focus{

    border-color:#d7ff00;
}


textarea{

    min-height:110px;

    resize:vertical;
}


/* =========================
   FOTO
========================= */

.photo-area{

    text-align:center;

    margin-bottom:20px;
}


.photo-preview{

    width:150px;

    height:180px;

    margin:
        0 auto 12px;

    border:
        2px dashed #555;

    border-radius:8px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#111;

    overflow:hidden;

    color:#777;

    font-size:14px;
}


.photo-preview img{

    width:100%;

    height:100%;

    object-fit:cover;
}


/* =========================
   RUOLI
========================= */

.roles{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;
}


.role{

    background:#171b18;

    border:
        1px solid #444b44;

    padding:10px;

    border-radius:7px;
}


.role label{

    display:flex;

    align-items:center;

    gap:7px;

    margin:0;

    cursor:pointer;

    color:#ddd;
}


.role input{

    width:auto;
}


/* =========================
   BUTTONS
========================= */

.buttons{

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    margin-top:20px;
}


button{

    border:0;

    border-radius:8px;

    padding:15px 20px;

    font-weight:bold;

    letter-spacing:1px;

    cursor:pointer;

    transition:.2s;
}


.generate{

    background:#d7ff00;

    color:#111;

    flex:1;
}


.whatsapp-button{

    background:#20c65a;

    color:#fff;

    width:100%;

    font-size:16px;

    border:
        1px solid #54e985;

    box-shadow:
        0 5px 20px
        rgba(32,198,90,.18);
}


button:hover{

    transform:translateY(-2px);

    filter:brightness(1.08);
}


button:disabled{

    opacity:.5;

    cursor:not-allowed;

    transform:none;
}


/* =========================
   CV GENERATO
========================= */

#cvCard{

    display:none;
}


.cv-header{

    display:flex;

    gap:20px;

    align-items:center;

    border-bottom:
        2px solid #d7ff00;

    padding-bottom:18px;

    margin-bottom:20px;
}


.cv-photo{

    width:120px;

    height:145px;

    border:
        2px solid #d7ff00;

    object-fit:cover;

    background:#111;
}


.cv-title h2{

    margin:
        0 0 7px;

    color:#d7ff00;

    font-size:26px;
}


.cv-title p{

    margin:4px 0;

    color:#aaa;
}


.cv-block{

    margin-bottom:18px;
}


.cv-block h3{

    color:#d7ff00;

    font-size:15px;

    border-bottom:
        1px solid #333;

    padding-bottom:6px;

    margin-bottom:9px;
}


.cv-block p{

    margin:5px 0;

    line-height:1.5;

    color:#ddd;
}


.badges{

    display:flex;

    flex-wrap:wrap;

    gap:7px;
}


.badge{

    border:
        1px solid #657000;

    color:#d7ff00;

    background:#181d10;

    padding:
        6px 9px;

    border-radius:5px;

    font-size:12px;
}


.whatsapp{

    color:#6cff8b;
}


/* =========================
   STAMPA
========================= */

@page{

    size:A4 portrait;

    margin:12mm;
}


@media print{

    html,
    body{

        margin:0 !important;

        padding:0 !important;

        background:#fff !important;

        color:#111 !important;
    }


    body::before{

        display:none !important;
    }


    .container{

        width:100% !important;

        max-width:none !important;

        margin:0 !important;
    }


    .header{

        margin:
            0 0 10mm 0 !important;
    }


    .header h1{

        color:#111 !important;

        font-size:24px !important;
    }


    .header p{

        color:#555 !important;
    }


    .container > .card:not(#cvCard){

        display:none !important;
    }


    #cvCard{

        display:block !important;

        background:#fff !important;

        color:#111 !important;

        border:
            2px solid #111 !important;

        border-radius:0 !important;

        box-shadow:none !important;

        padding:10mm !important;

        margin:0 !important;
    }


    .cv-header{

        border-bottom:
            2px solid #111 !important;
    }


    .cv-photo{

        border:
            2px solid #111 !important;
    }


    .cv-title h2{

        color:#111 !important;
    }


    .cv-title p{

        color:#444 !important;
    }


    .cv-block{

        page-break-inside:avoid !important;

        break-inside:avoid !important;
    }


    .cv-block h3{

        color:#111 !important;

        border-bottom:
            1px solid #999 !important;
    }


    .cv-block p{

        color:#222 !important;
    }


    .badge{

        color:#111 !important;

        background:#eee !important;

        border:
            1px solid #555 !important;
    }


    .buttons{

        display:none !important;
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .grid{

        grid-template-columns:1fr;
    }


    .roles{

        grid-template-columns:
            1fr 1fr;
    }


    .cv-header{

        flex-direction:column;

        text-align:center;
    }

}

</style>

</head>

<script>

/* ==================================================
   VARIABILE FOTO
================================================== */

let photoData = "";


/* ==================================================
   FOTO OPERATORE
================================================== */

document
.getElementById("photo")
.addEventListener(
    "change",
    function(){

        const file = this.files[0];

        if(!file){
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                photoData =
                    e.target.result;


                document
                .getElementById(
                    "photoPreview"
                )
                .innerHTML =
                    '<img src="' +
                    photoData +
                    '" alt="Foto operatore">';

            };


        reader.readAsDataURL(file);

    }
);


/* ==================================================
   GENERA CV
================================================== */

function generaCV(){


    const nome =
        document
        .getElementById("nome")
        .value
        .trim();


    const cognome =
        document
        .getElementById("cognome")
        .value
        .trim();


    const nickname =
        document
        .getElementById("nickname")
        .value
        .trim();


    const eta =
        document
        .getElementById("eta")
        .value
        .trim();


    const provincia =
        document
        .getElementById("provincia")
        .value
        .trim();


    const citta =
        document
        .getElementById("citta")
        .value
        .trim();


    const anni =
        document
        .getElementById("anni")
        .value
        .trim();


    const squadra =
        document
        .getElementById("squadra")
        .value
        .trim();


    const esperienze =
        document
        .getElementById("esperienze")
        .value
        .trim();


    const equipaggiamento =
        document
        .getElementById("equipaggiamento")
        .value
        .trim();


    const disponibilita =
        document
        .getElementById("disponibilita")
        .value;


    const trasferte =
        document
        .getElementById("trasferte")
        .value;


    const whatsapp =
        document
        .getElementById("whatsapp")
        .value
        .trim();


    const presentazione =
        document
        .getElementById("presentazione")
        .value
        .trim();


    /* RUOLI */

    const checkedRoles =
        document.querySelectorAll(
            '.role input[type="checkbox"]:checked'
        );


    const roles = [];


    checkedRoles.forEach(
        function(item){

            roles.push(
                item.value
            );

        }
    );


    /* NOME */

    document
    .getElementById("cvName")
    .textContent =
        (
            nome +
            " " +
            cognome
        ).trim()
        ||
        "OPERATORE SOAS";


    /* NICKNAME */

    document
    .getElementById("cvNickname")
    .textContent =
        nickname
        ?
        "CALLSIGN: " + nickname
        :
        "";


    /* LOCALITÀ */

    let locationText = "";


    if(citta){

        locationText += citta;

    }


    if(provincia){

        if(locationText){

            locationText += " - ";

        }

        locationText += provincia;

    }


    if(eta){

        if(locationText){

            locationText += " | ";

        }

        locationText +=
            "Età: " + eta;

    }


    document
    .getElementById("cvLocation")
    .textContent =
        locationText;


    /* ESPERIENZA */

    document
    .getElementById("cvExperience")
    .textContent =
        "Anni di esperienza: " +
        (
            anni ||
            "Non specificato"
        );


    document
    .getElementById("cvTeam")
    .textContent =
        "Squadra attuale: " +
        (
            squadra ||
            "Non specificata"
        );


    document
    .getElementById("cvPrevious")
    .textContent =
        "Esperienze precedenti: " +
        (
            esperienze ||
            "Nessuna esperienza precedente indicata"
        );


    /* RUOLI */

    const rolesContainer =
        document
        .getElementById(
            "cvRoles"
        );


    rolesContainer.innerHTML = "";


    if(roles.length === 0){

        rolesContainer.innerHTML =
            '<span class="badge">' +
            'Nessun ruolo indicato' +
            '</span>';

    }
    else{

        roles.forEach(
            function(role){

                const badge =
                    document.createElement(
                        "span"
                    );


                badge.className =
                    "badge";


                badge.textContent =
                    role;


                rolesContainer
                .appendChild(
                    badge
                );

            }
        );

    }


    /* COMPETENZE */

    const skills = [

        "Tiro: " +
        document
        .getElementById("tiro")
        .value,

        "Movimento tattico: " +
        document
        .getElementById("movimento")
        .value,

        "CQB: " +
        document
        .getElementById("cqb")
        .value,

        "Radio: " +
        document
        .getElementById("radio")
        .value,

        "Navigazione: " +
        document
        .getElementById("navigazione")
        .value,

        "Primo soccorso: " +
        document
        .getElementById("soccorso")
        .value

    ];


    document
    .getElementById("cvSkills")
    .textContent =
        skills.join(" | ");


    /* EQUIPAGGIAMENTO */

    document
    .getElementById("cvEquipment")
    .textContent =
        equipaggiamento ||
        "Non specificato";


    /* DISPONIBILITÀ */

    document
    .getElementById("cvAvailability")
    .textContent =
        "Disponibilità: " +
        disponibilita;


    document
    .getElementById("cvTravel")
    .textContent =
        "Trasferte: " +
        trasferte;


    /* PRESENTAZIONE */

    document
    .getElementById("cvPresentation")
    .textContent =
        presentazione ||
        "Nessuna presentazione inserita";


    /* WHATSAPP */

    document
    .getElementById("cvWhatsapp")
    .textContent =
        whatsapp ||
        "Numero WhatsApp non inserito";


    /* FOTO */

    const cvPhoto =
        document
        .getElementById("cvPhoto");


    if(photoData){

        cvPhoto.src =
            photoData;

    }
    else{

        cvPhoto.removeAttribute(
            "src"
        );

        cvPhoto.alt =
            "Nessuna foto";

    }


    /* MOSTRA CV */

    const cvCard =
        document
        .getElementById("cvCard");


    cvCard.style.display =
        "block";


    cvCard.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}


/* ==================================================
   CREAZIONE PDF
================================================== */

async function creaPDF(){

    if(
        !window.jspdf ||
        !window.jspdf.jsPDF
    ){

        throw new Error(
            "Libreria PDF non disponibile."
        );

    }


    const {
        jsPDF
    } = window.jspdf;


    const pdf =
        new jsPDF({
            orientation:"portrait",
            unit:"mm",
            format:"a4"
        });


    const pageWidth =
        pdf.internal.pageSize.getWidth();


    const pageHeight =
        pdf.internal.pageSize.getHeight();


    /* SFONDO */

    pdf.setFillColor(
        12,
        15,
        14
    );


    pdf.rect(
        0,
        0,
        pageWidth,
        pageHeight,
        "F"
    );


    /* BORDO */

    pdf.setDrawColor(
        215,
        255,
        0
    );


    pdf.setLineWidth(
        0.7
    );


    pdf.rect(
        8,
        8,
        pageWidth - 16,
        pageHeight - 16
    );


    /* HEADER */

    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.setFontSize(20);


    pdf.setTextColor(
        215,
        255,
        0
    );


    pdf.text(
        "SOAS AIR SOFT TEAM",
        pageWidth / 2,
        20,
        {
            align:"center"
        }
    );


    pdf.setFontSize(9);


    pdf.setTextColor(
        170,
        170,
        170
    );


    pdf.text(
        "TACTICAL OPERATOR CV",
        pageWidth / 2,
        27,
        {
            align:"center"
        }
    );


    pdf.setDrawColor(
        215,
        255,
        0
    );


    pdf.setLineWidth(
        0.4
    );


    pdf.line(
        15,
        31,
        pageWidth - 15,
        31
    );


    let y = 40;


    /* FOTO */

    if(photoData){

        try{

            const img =
                pdf.getImageProperties(
                    photoData
                );


            let imgW = 38;

            let imgH =
                (
                    img.height /
                    img.width
                ) * imgW;


            const maxH = 48;


            if(imgH > maxH){

                imgH = maxH;

                imgW =
                    (
                        img.width /
                        img.height
                    ) * imgH;

            }


            pdf.addImage(
                photoData,
                "JPEG",
                15,
                y,
                imgW,
                imgH
            );

        }
        catch(error){

            console.log(
                "Foto non inserita:",
                error
            );

        }

    }
    else{

        pdf.setDrawColor(
            100,
            100,
            100
        );


        pdf.rect(
            15,
            y,
            38,
            48
        );


        pdf.setFontSize(8);


        pdf.setTextColor(
            130,
            130,
            130
        );


        pdf.text(
            "NO FOTO",
            34,
            y + 25,
            {
                align:"center"
            }
        );

    }


    /* DATI PRINCIPALI */

    const nomeCompleto =
        (
            document
            .getElementById("nome")
            .value
            +
            " " +
            document
            .getElementById("cognome")
            .value
        ).trim()
        ||
        "OPERATORE SOAS";


    const nickname =
        document
        .getElementById("nickname")
        .value
        .trim();


    const eta =
        document
        .getElementById("eta")
        .value
        .trim();


    const citta =
        document
        .getElementById("citta")
        .value
        .trim();


    const provincia =
        document
        .getElementById("provincia")
        .value
        .trim();


    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.setFontSize(17);


    pdf.setTextColor(
        255,
        255,
        255
    );


    pdf.text(
        nomeCompleto,
        60,
        y + 10
    );


    pdf.setFont(
        "helvetica",
        "normal"
    );


    pdf.setFontSize(10);


    pdf.setTextColor(
        215,
        255,
        0
    );


    if(nickname){

        pdf.text(
            "CALLSIGN: " + nickname,
            60,
            y + 18
        );

    }


    let info = "";


    if(citta){

        info += citta;

    }


    if(provincia){

        if(info){

            info += " - ";

        }

        info += provincia;

    }


    if(eta){

        if(info){

            info += " | ";

        }

        info +=
            "Età: " +
            eta;

    }


    if(info){

        pdf.setTextColor(
            180,
            180,
            180
        );


        pdf.text(
            info,
            60,
            y + 27
        );

    }


    y += 58;


    /* FUNZIONE TITOLO */

    function titolo(text){

        if(y > pageHeight - 30){

            nuovaPagina();

        }


        pdf.setFillColor(
            28,
            34,
            28
        );


        pdf.rect(
            15,
            y - 5,
            pageWidth - 30,
            8,
            "F"
        );


        pdf.setFont(
            "helvetica",
            "bold"
        );


        pdf.setFontSize(10);


        pdf.setTextColor(
            215,
            255,
            0
        );


        pdf.text(
            text,
            18,
            y + 1
        );


        y += 10;

    }


    /* NUOVA PAGINA */

    function nuovaPagina(){

        pdf.addPage();


        pdf.setFillColor(
            12,
            15,
            14
        );


        pdf.rect(
            0,
            0,
            pageWidth,
            pageHeight,
            "F"
        );


        pdf.setDrawColor(
            215,
            255,
            0
        );


        pdf.rect(
            8,
            8,
            pageWidth - 16,
            pageHeight - 16
        );


        y = 18;

    }


    /* TESTO */

    function testo(text){

        if(!text){

            text =
                "Non specificato";

        }


        pdf.setFont(
            "helvetica",
            "normal"
        );


        pdf.setFontSize(9);


        pdf.setTextColor(
            225,
            225,
            225
        );


        const lines =
            pdf.splitTextToSize(
                String(text),
                pageWidth - 36
            );


        lines.forEach(
            function(line){

                if(
                    y >
                    pageHeight - 20
                ){

                    nuovaPagina();

                }


                pdf.text(
                    line,
                    18,
                    y
                );


                y += 5;

            }
        );


        y += 2;

    }


    /* ESPERIENZA */

    titolo(
        "ESPERIENZA OPERATIVA"
    );


    testo(
        "Anni di esperienza: " +
        (
            document
            .getElementById("anni")
            .value ||
            "Non specificato"
        )
    );


    testo(
        "Squadra attuale: " +
        (
            document
            .getElementById("squadra")
            .value ||
            "Non specificata"
        )
    );


    testo(
        "Esperienze precedenti: " +
        (
            document
            .getElementById("esperienze")
            .value ||
            "Nessuna esperienza indicata"
        )
    );


    /* RUOLI */

    titolo(
        "RUOLI OPERATIVI"
    );


    const checked =
        document.querySelectorAll(
            '.role input[type="checkbox"]:checked'
        );


    const roleList = [];


    checked.forEach(
        function(item){

            roleList.push(
                item.value
            );

        }
    );


    testo(
        roleList.length
        ?
        roleList.join(" | ")
        :
        "Nessun ruolo indicato"
    );


    /* COMPETENZE */

    titolo(
        "COMPETENZE"
    );


    testo(
        "Tiro: " +
        document
        .getElementById("tiro")
        .value
    );


    testo(
        "Movimento tattico: " +
        document
        .getElementById("movimento")
        .value
    );


    testo(
        "CQB: " +
        document
        .getElementById("cqb")
        .value
    );


    testo(
        "Comunicazioni radio: " +
        document
        .getElementById("radio")
        .value
    );


    testo(
        "Navigazione: " +
        document
        .getElementById("navigazione")
        .value
    );


    testo(
        "Primo soccorso: " +
        document
        .getElementById("soccorso")
        .value
    );


    /* EQUIPAGGIAMENTO */

    titolo(
        "EQUIPAGGIAMENTO"
    );


    testo(
        document
        .getElementById("equipaggiamento")
        .value ||
        "Non specificato"
    );


    /* DISPONIBILITÀ */

    titolo(
        "DISPONIBILITÀ"
    );


    testo(
        "Disponibilità: " +
        document
        .getElementById("disponibilita")
        .value
    );


    testo(
        "Trasferte: " +
        document
        .getElementById("trasferte")
        .value
    );


    /* PRESENTAZIONE */

    titolo(
        "PRESENTAZIONE"
    );


    testo(
        document
        .getElementById("presentazione")
        .value ||
        "Nessuna presentazione inserita"
    );


    /* CONTATTO */

    titolo(
        "CONTATTO"
    );


    testo(
        "WhatsApp: " +
        (
            document
            .getElementById("whatsapp")
            .value ||
            "Non inserito"
        )
    );


    /* FOOTER */

    pdf.setDrawColor(
        215,
        255,
        0
    );


    pdf.line(
        15,
        pageHeight - 17,
        pageWidth - 15,
        pageHeight - 17
    );


    pdf.setFontSize(7);


    pdf.setTextColor(
        110,
        110,
        110
    );


    pdf.text(
        "SOAS AIR SOFT TEAM • TACTICAL OPERATOR CV",
        pageWidth / 2,
        pageHeight - 11,
        {
            align:"center"
        }
    );


    /* NOME FILE */

    const safeName =
        nomeCompleto
        .replace(
            /[^a-z0-9àèéìòù _-]/gi,
            ""
        )
        .trim()
        .replace(
            /\s+/g,
            "_"
        );


    const filename =
        "SOAS_CV_" +
        (
            safeName ||
            "OPERATORE"
        ) +
        ".pdf";


    /* CREA BLOB */

    const blob =
        pdf.output(
            "blob"
        );


    return {
        blob:blob,
        filename:filename
    };

}


/* ==================================================
   INVIO WHATSAPP
================================================== */

async function inviaWhatsApp(){

    const button =
        document
        .getElementById(
            "whatsappButton"
        );


    const cvCard =
        document
        .getElementById(
            "cvCard"
        );


    if(
        !cvCard ||
        cvCard.style.display === "none"
    ){

        alert(
            "Prima devi generare il CV."
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "⏳ PREPARAZIONE CV...";


    try{


        /* CREA PDF */

        const result =
            await creaPDF();


        const file =
            new File(
                [result.blob],
                result.filename,
                {
                    type:"application/pdf"
                }
            );


        /*
         * MESSAGGIO WHATSAPP
         */

        const nome =
            (
                document
                .getElementById("nome")
                .value
                .trim()
                +
                " " +
                document
                .getElementById("cognome")
                .value
                .trim()
            ).trim();


        const message =
            "Ciao, sono " +
            (
                nome ||
                "un candidato"
            ) +
            ". Ti invio il mio CV da operatore SOAS.";


        /*
         * CONDIVISIONE FILE
         */

        if(
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({
                files:[file]
            })
        ){

            button.textContent =
                "📲 APERTURA WHATSAPP...";


            await navigator.share({

                title:
                    "CV Operatore SOAS",

                text:
                    message,

                files:[
                    file
                ]

            });


            /*
             * SE L'UTENTE HA CONDIVISO
             */

            button.textContent =
                "✅ CV CONDIVISO";

        }
        else{

            /*
             * FALLBACK:
             * scarica il PDF e apre
             * direttamente la chat SOAS
             */

            const url =
                URL.createObjectURL(
                    result.blob
                );


            const a =
                document.createElement(
                    "a"
                );


            a.href =
                url;


            a.download =
                result.filename;


            document.body.appendChild(
                a
            );


            a.click();


            a.remove();


            setTimeout(
                function(){

                    URL.revokeObjectURL(
                        url
                    );

                },
                3000
            );


            /*
             * NUMERO SOAS
             *
             * +39 350 107 7763
             *
             * senza + e spazi
             */

            const numeroSOAS =
                "393501077763";


            const whatsappURL =
                "https://wa.me/" +
                numeroSOAS +
                "?text=" +
                encodeURIComponent(
                    message +
                    "\n\n" +
                    "Il PDF del CV è stato scaricato e può essere allegato a questa chat."
                );


            window.open(
                whatsappURL,
                "_blank"
            );


            button.textContent =
                "📲 CV PRONTO PER WHATSAPP";

        }


    }
    catch(error){

        console.error(
            error
        );


        /*
         * L'utente potrebbe aver
         * semplicemente annullato
         * la condivisione.
         */

        if(
            error &&
            error.name ===
            "AbortError"
        ){

            button.textContent =
                "📲 INVIA CV A SOAS";

        }
        else{

            alert(
                "Non è stato possibile condividere il CV. Riprova."
            );


            button.textContent =
                "📲 INVIA CV A SOAS";

        }

    }


    button.disabled = false;

}

</script>
