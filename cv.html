<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SOAS - CV Operatore</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#080b0a url("sfondo-cv.jpeg") center/cover fixed;
    color:#fff;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    z-index:-1;
}

.container{
    width:95%;
    max-width:900px;
    margin:30px auto;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    margin:0;
    font-size:32px;
    letter-spacing:4px;
    color:#d7ff00;
}

.header p{
    margin-top:8px;
    color:#aaa;
    letter-spacing:2px;
}

.card{
    background:rgba(12,15,14,.96);
    border:1px solid #384038;
    border-radius:12px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.section-title{
    color:#d7ff00;
    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;
    border-bottom:1px solid #424942;
    padding-bottom:10px;
    margin-bottom:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field.full{
    grid-column:1/-1;
}

label{
    font-size:12px;
    color:#aaa;
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:1px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border-radius:7px;
    border:1px solid #444b44;
    background:#171b18;
    color:#fff;
    font-size:14px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#d7ff00;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.roles{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.role{
    background:#171b18;
    border:1px solid #444b44;
    padding:10px;
    border-radius:7px;
}

.role label{
    display:flex;
    align-items:center;
    gap:7px;
    margin:0;
    cursor:pointer;
    color:#ddd;
}

.role input{
    width:auto;
}

.photo-area{
    text-align:center;
    margin-bottom:20px;
}

.photo-preview{
    width:150px;
    height:180px;
    margin:0 auto 12px;
    border:2px dashed #555;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111;
    overflow:hidden;
    color:#777;
    font-size:14px;
}

.photo-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:20px;
}

button{
    border:0;
    border-radius:8px;
    padding:14px 20px;
    font-weight:bold;
    letter-spacing:1px;
    cursor:pointer;
    transition:.2s;
}

.generate{
    background:#d7ff00;
    color:#111;
    flex:1;
}

.pdf{
    background:#222;
    color:#d7ff00;
    border:1px solid #d7ff00;
    flex:1;
}

button:hover{
    transform:translateY(-2px);
    filter:brightness(1.1);
}

/* =========================
   CV GENERATO
========================= */

#cvCard{
    display:none;
}

.cv-header{
    display:flex;
    gap:20px;
    align-items:center;
    border-bottom:2px solid #d7ff00;
    padding-bottom:18px;
    margin-bottom:20px;
}

.cv-photo{
    width:120px;
    height:145px;
    border:2px solid #d7ff00;
    object-fit:cover;
    background:#111;
}

.cv-title h2{
    margin:0 0 7px;
    color:#d7ff00;
    font-size:26px;
}

.cv-title p{
    margin:4px 0;
    color:#aaa;
}

.cv-block{
    margin-bottom:18px;
}

.cv-block h3{
    color:#d7ff00;
    font-size:15px;
    border-bottom:1px solid #333;
    padding-bottom:6px;
    margin-bottom:9px;
}

.cv-block p{
    margin:5px 0;
    line-height:1.5;
    color:#ddd;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.badge{
    border:1px solid #657000;
    color:#d7ff00;
    background:#181d10;
    padding:6px 9px;
    border-radius:5px;
    font-size:12px;
}

.whatsapp{
    color:#6cff8b;
}

/* =========================
   STAMPA / PDF
========================= */

@page{
    size:A4 portrait;
    margin:12mm;
}

@media print{

    html,
    body{
        margin:0 !important;
        padding:0 !important;
        background:#ffffff !important;
        color:#111 !important;
    }

    body::before{
        display:none !important;
    }

    .container{
        width:100% !important;
        max-width:none !important;
        margin:0 !important;
    }

    .header{
        margin:0 0 10mm 0 !important;
        text-align:center;
    }

    .header h1{
        color:#111 !important;
        font-size:24px !important;
        letter-spacing:3px !important;
    }

    .header p{
        color:#555 !important;
        font-size:10px !important;
    }

    /* Nascondiamo tutto il modulo */

    .container > .card:not(#cvCard){
        display:none !important;
    }

    /* Mostriamo solo il CV */

    #cvCard{
        display:block !important;
        background:#fff !important;
        color:#111 !important;
        border:2px solid #111 !important;
        border-radius:0 !important;
        box-shadow:none !important;
        padding:10mm !important;
        margin:0 !important;
        width:100% !important;
    }

    .cv-header{
        display:flex !important;
        align-items:center !important;
        border-bottom:2px solid #111 !important;
        padding-bottom:6mm !important;
        margin-bottom:7mm !important;
    }

    .cv-photo{
        width:35mm !important;
        height:43mm !important;
        border:2px solid #111 !important;
        background:#eee !important;
    }

    .cv-title h2{
        color:#111 !important;
        font-size:22px !important;
        margin:0 0 3mm 0 !important;
    }

    .cv-title p{
        color:#444 !important;
        font-size:10px !important;
    }

    .cv-block{
        margin-bottom:6mm !important;
        page-break-inside:avoid !important;
        break-inside:avoid !important;
    }

    .cv-block h3{
        color:#111 !important;
        font-size:12px !important;
        border-bottom:1px solid #999 !important;
        padding-bottom:2mm !important;
        margin-bottom:3mm !important;
    }

    .cv-block p{
        color:#222 !important;
        font-size:10px !important;
        line-height:1.45 !important;
    }

    .badges{
        gap:2mm !important;
    }

    .badge{
        color:#111 !important;
        background:#eee !important;
        border:1px solid #555 !important;
        padding:2mm 3mm !important;
        font-size:9px !important;
    }

    .whatsapp{
        color:#111 !important;
    }

    /* Nasconde il pulsante PDF nella stampa */

    .buttons{
        display:none !important;
    }

}

/* MOBILE */

@media(max-width:650px){

    .grid{
        grid-template-columns:1fr;
    }

    .roles{
        grid-template-columns:1fr 1fr;
    }

    .cv-header{
        flex-direction:column;
        text-align:center;
    }

}

</style>
</head>


<body>

<div class="container">

    <div class="header">

        <h1>SOAS AIR SOFT TEAM</h1>

        <p>TACTICAL OPERATOR CV</p>

    </div>


    <!-- =========================
         IDENTITÀ
    ========================== -->

    <div class="card">

        <div class="section-title">
            IDENTITÀ OPERATORE
        </div>

        <div class="photo-area">

            <div class="photo-preview" id="photoPreview">
                📷 FOTO OPERATORE
            </div>

            <input
                type="file"
                id="photo"
                accept="image/*"
            >

        </div>


        <div class="grid">

            <div class="field">

                <label>Nome</label>

                <input
                    id="nome"
                    type="text"
                    placeholder="Nome"
                >

            </div>


            <div class="field">

                <label>Cognome</label>

                <input
                    id="cognome"
                    type="text"
                    placeholder="Cognome"
                >

            </div>


            <div class="field">

                <label>Nickname</label>

                <input
                    id="nickname"
                    type="text"
                    placeholder="Nickname"
                >

            </div>


            <div class="field">

                <label>Età</label>

                <input
                    id="eta"
                    type="number"
                    placeholder="Età"
                >

            </div>


            <div class="field">

                <label>Provincia</label>

                <input
                    id="provincia"
                    type="text"
                    placeholder="Provincia"
                >

            </div>


            <div class="field">

                <label>Città</label>

                <input
                    id="citta"
                    type="text"
                    placeholder="Città"
                >

            </div>

        </div>

    </div>


    <!-- =========================
         ESPERIENZA
    ========================== -->

    <div class="card">

        <div class="section-title">
            ESPERIENZA OPERATIVA
        </div>


        <div class="grid">

            <div class="field">

                <label>Anni di esperienza</label>

                <input
                    id="anni"
                    type="number"
                    placeholder="Es. 5"
                >

            </div>


            <div class="field">

                <label>Squadra attuale</label>

                <input
                    id="squadra"
                    type="text"
                    placeholder="Nome squadra"
                >

            </div>


            <div class="field full">

                <label>Esperienze precedenti</label>

                <textarea
                    id="esperienze"
                    placeholder="Squadre, eventi, tornei, milsim..."
                ></textarea>

            </div>

        </div>

    </div>


    <!-- =========================
         RUOLI
    ========================== -->

    <div class="card">

        <div class="section-title">
            RUOLI OPERATIVI
        </div>


        <div class="roles">

            <div class="role">
                <label>
                    <input type="checkbox" value="Fuciliere">
                    Fuciliere
                </label>
            </div>


            <div class="role">
                <label>
                    <input type="checkbox" value="Assaltatore">
                    Assaltatore
                </label>
            </div>


            <div class="role">
                <label>
                    <input type="checkbox" value="Supporto">
                    Supporto
                </label>
            </div>


            <div class="role">
                <label>
                    <input type="checkbox" value="Sniper">
                    Sniper
                </label>
            </div>


            <div class="role">
                <label>
                    <input type="checkbox" value="Scout">
                    Scout
                </label>
            </div>


            <div class="role">
                <label>
                    <input type="checkbox" value="Medico">
                    Medico
                </label>
            </div>


            <div class="role">
                <label>
                    <input type="checkbox" value="Artificiere">
                    Artificiere
                </label>
            </div>


            <div class="role">
                <label>
                    <input type="checkbox" value="CQB">
                    CQB
                </label>
            </div>


            <div class="role">
                <label>
                    <input type="checkbox" value="Comandante">
                    Comandante
                </label>
            </div>

        </div>

    </div>


    <!-- =========================
         COMPETENZE
    ========================== -->

    <div class="card">

        <div class="section-title">
            COMPETENZE
        </div>


        <div class="grid">

            <div class="field">

                <label>Tiro</label>

                <select id="tiro">
                    <option>Base</option>
                    <option>Buono</option>
                    <option>Avanzato</option>
                    <option>Esperto</option>
                </select>

            </div>


            <div class="field">

                <label>Movimento tattico</label>

                <select id="movimento">
                    <option>Base</option>
                    <option>Buono</option>
                    <option>Avanzato</option>
                    <option>Esperto</option>
                </select>

            </div>


            <div class="field">

                <label>CQB</label>

                <select id="cqb">
                    <option>Base</option>
                    <option>Buono</option>
                    <option>Avanzato</option>
                    <option>Esperto</option>
                </select>

            </div>


            <div class="field">

                <label>Comunicazioni radio</label>

                <select id="radio">
                    <option>Base</option>
                    <option>Buono</option>
                    <option>Avanzato</option>
                    <option>Esperto</option>
                </select>

            </div>


            <div class="field">

                <label>Navigazione</label>

                <select id="navigazione">
                    <option>Base</option>
                    <option>Buono</option>
                    <option>Avanzato</option>
                    <option>Esperto</option>
                </select>

            </div>


            <div class="field">

                <label>Primo soccorso</label>

                <select id="soccorso">
                    <option>Base</option>
                    <option>Buono</option>
                    <option>Avanzato</option>
                    <option>Esperto</option>
                </select>

            </div>

        </div>

    </div>


    <!-- =========================
         EQUIPAGGIAMENTO
    ========================== -->

    <div class="card">

        <div class="section-title">
            EQUIPAGGIAMENTO
        </div>

        <textarea
            id="equipaggiamento"
            placeholder="Es. M4, plate carrier, radio, ottica, sidearm..."
        ></textarea>

    </div>


    <!-- =========================
         DISPONIBILITÀ
    ========================== -->

    <div class="card">

        <div class="section-title">
            DISPONIBILITÀ
        </div>


        <div class="grid">

            <div class="field">

                <label>Disponibilità</label>

                <select id="disponibilita">

                    <option>Weekend</option>

                    <option>Sabato</option>

                    <option>Domenica</option>

                    <option>Infrasettimanale</option>

                    <option>Flessibile</option>

                </select>

            </div>


            <div class="field">

                <label>Trasferte</label>

                <select id="trasferte">

                    <option>Si</option>

                    <option>No</option>

                    <option>Da valutare</option>

                </select>

            </div>


            <div class="field full">

                <label>Numero WhatsApp</label>

                <input
                    id="whatsapp"
                    type="tel"
                    placeholder="+39 333 1234567"
                >

            </div>


            <div class="field full">

                <label>Presentazione personale</label>

                <textarea
                    id="presentazione"
                    placeholder="Parlaci di te, della tua esperienza e di cosa cerchi in una squadra..."
                ></textarea>

            </div>

        </div>


        <div class="buttons">

            <button
                class="generate"
                onclick="generaCV()"
            >
                GENERA IL MIO CV
            </button>

        </div>

    </div>


    <!-- =========================
         CV GENERATO
    ========================== -->

    <div class="card" id="cvCard">

        <div class="cv-header">

            <img
                id="cvPhoto"
                class="cv-photo"
                alt="Foto operatore"
            >


            <div class="cv-title">

                <h2 id="cvName">
                    OPERATORE SOAS
                </h2>

                <p id="cvNickname"></p>

                <p id="cvLocation"></p>

            </div>

        </div>


        <div class="cv-block">

            <h3>ESPERIENZA</h3>

            <p id="cvExperience"></p>

            <p id="cvTeam"></p>

            <p id="cvPrevious"></p>

        </div>


        <div class="cv-block">

            <h3>RUOLI OPERATIVI</h3>

            <div
                class="badges"
                id="cvRoles"
            ></div>

        </div>


        <div class="cv-block">

            <h3>COMPETENZE</h3>

            <p id="cvSkills"></p>

        </div>


        <div class="cv-block">

            <h3>EQUIPAGGIAMENTO</h3>

            <p id="cvEquipment"></p>

        </div>


        <div class="cv-block">

            <h3>DISPONIBILITÀ</h3>

            <p id="cvAvailability"></p>

            <p id="cvTravel"></p>

        </div>


        <div class="cv-block">

            <h3>PRESENTAZIONE</h3>

            <p id="cvPresentation"></p>

        </div>


        <div class="cv-block">

            <h3>CONTATTO</h3>

            <p
                class="whatsapp"
                id="cvWhatsapp"
            ></p>

        </div>


        <div class="buttons">

            <button
                class="pdf"
                onclick="scaricaPDF()"
            >
                SCARICA IL CV IN PDF
            </button>

        </div>

    </div>

</div>


<script>

let photoData = "";


/* =========================
   FOTO
========================= */

document
.getElementById("photo")
.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        photoData = e.target.result;

        document
        .getElementById("photoPreview")
        .innerHTML =
        '<img src="' +
        photoData +
        '" alt="Foto operatore">';

    };

    reader.readAsDataURL(file);

});


/* =========================
   GENERA CV
========================= */

function generaCV(){

    const nome =
        document.getElementById("nome").value.trim();

    const cognome =
        document.getElementById("cognome").value.trim();

    const nickname =
        document.getElementById("nickname").value.trim();

    const eta =
        document.getElementById("eta").value.trim();

    const provincia =
        document.getElementById("provincia").value.trim();

    const citta =
        document.getElementById("citta").value.trim();

    const anni =
        document.getElementById("anni").value.trim();

    const squadra =
        document.getElementById("squadra").value.trim();

    const esperienze =
        document.getElementById("esperienze").value.trim();

    const equipaggiamento =
        document.getElementById("equipaggiamento").value.trim();

    const disponibilita =
        document.getElementById("disponibilita").value;

    const trasferte =
        document.getElementById("trasferte").value;

    const whatsapp =
        document.getElementById("whatsapp").value.trim();

    const presentazione =
        document.getElementById("presentazione").value.trim();


    /* RUOLI */

    const checkedRoles =
        document.querySelectorAll(
            '.role input[type="checkbox"]:checked'
        );

    const roles = [];

    checkedRoles.forEach(function(item){

        roles.push(item.value);

    });


    /* NOME */

    document
    .getElementById("cvName")
    .textContent =
        (nome + " " + cognome).trim()
        || "OPERATORE SOAS";


    /* NICKNAME */

    document
    .getElementById("cvNickname")
    .textContent =
        nickname
        ? "CALLSIGN: " + nickname
        : "";


    /* LOCALITÀ */

    let locationText = "";

    if(citta){
        locationText += citta;
    }

    if(provincia){

        if(locationText){
            locationText += " - ";
        }

        locationText += provincia;

    }

    if(eta){

        if(locationText){
            locationText += " | ";
        }

        locationText += "Età: " + eta;

    }


    document
    .getElementById("cvLocation")
    .textContent =
        locationText;


    /* ESPERIENZA */

    document
    .getElementById("cvExperience")
    .textContent =
        "Anni di esperienza: " +
        (anni || "Non specificato");


    document
    .getElementById("cvTeam")
    .textContent =
        "Squadra attuale: " +
        (squadra || "Non specificata");


    document
    .getElementById("cvPrevious")
    .textContent =
        "Esperienze precedenti: " +
        (
            esperienze ||
            "Nessuna esperienza precedente indicata"
        );


    /* RUOLI */

    const rolesContainer =
        document.getElementById("cvRoles");

    rolesContainer.innerHTML = "";


    if(roles.length === 0){

        rolesContainer.innerHTML =
            '<span class="badge">' +
            'Nessun ruolo indicato' +
            '</span>';

    }else{

        roles.forEach(function(role){

            const badge =
                document.createElement("span");

            badge.className = "badge";

            badge.textContent = role;

            rolesContainer.appendChild(badge);

        });

    }


    /* COMPETENZE */

    const skills = [

        "Tiro: " +
        document.getElementById("tiro").value,

        "Movimento tattico: " +
        document.getElementById("movimento").value,

        "CQB: " +
        document.getElementById("cqb").value,

        "Radio: " +
        document.getElementById("radio").value,

        "Navigazione: " +
        document.getElementById("navigazione").value,

        "Primo soccorso: " +
        document.getElementById("soccorso").value

    ];


    document
    .getElementById("cvSkills")
    .textContent =
        skills.join(" | ");


    /* EQUIPAGGIAMENTO */

    document
    .getElementById("cvEquipment")
    .textContent =
        equipaggiamento ||
        "Non specificato";


    /* DISPONIBILITÀ */

    document
    .getElementById("cvAvailability")
    .textContent =
        "Disponibilità: " +
        disponibilita;


    document
    .getElementById("cvTravel")
    .textContent =
        "Trasferte: " +
        trasferte;


    /* PRESENTAZIONE */

    document
    .getElementById("cvPresentation")
    .textContent =
        presentazione ||
        "Nessuna presentazione inserita";


    /* WHATSAPP */

    document
    .getElementById("cvWhatsapp")
    .textContent =
        whatsapp ||
        "Numero WhatsApp non inserito";


    /* FOTO NEL CV */

    const cvPhoto =
        document.getElementById("cvPhoto");


    if(photoData){

        cvPhoto.src = photoData;

    }else{

        cvPhoto.removeAttribute("src");

        cvPhoto.alt =
            "Nessuna foto";

    }


    /* MOSTRA CV */

    const cvCard =
        document.getElementById("cvCard");

    cvCard.style.display = "block";


    cvCard.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}


/* =========================
   STAMPA / PDF
========================= */

function scaricaPDF(){

    const cv =
        document.getElementById("cvCard");


    if(cv.style.display === "none"){

        alert(
            "Prima genera il CV."
        );

        return;

    }


    /*
      Usiamo la funzione di stampa nativa
      del browser.

      Nella finestra che compare:
      Destinazione → Salva come PDF
    */

    window.print();

}

</script>

</body>
</html>
