<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SOAS AIR SOFT TEAM</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
        }

        /* CONTENITORE HOMEPAGE */

        .homepage {
            position: relative;
            width: 100%;
            max-width: 972px;
        }

        /* IMMAGINE HOMEPAGE */

        .homepage img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* ZONE CLICCABILI */

        .click-area {
            position: absolute;
            display: block;
            z-index: 10;
            cursor: pointer;
            border-radius: 12px;

            transition:
                background 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.25s ease;
        }


        /* ========================= */
        /* INSTAGRAM - ROSA / VIOLA */
        /* ========================= */

        .instagram {
            left: 8.5%;
            right: 8.5%;
            top: 44.5%;
            height: 7.8%;
        }

        .instagram:hover {
            background: rgba(225, 48, 108, 0.25);

            box-shadow:
                0 0 10px rgba(225, 48, 108, 0.7),
                0 0 25px rgba(225, 48, 108, 0.45),
                inset 0 0 15px rgba(225, 48, 108, 0.2);

            transform: scale(1.02);
        }

        .instagram:active {
            background: rgba(225, 48, 108, 0.40);

            box-shadow:
                0 0 15px rgba(225, 48, 108, 0.9),
                0 0 30px rgba(225, 48, 108, 0.7),
                inset 0 0 20px rgba(225, 48, 108, 0.3);

            transform: scale(0.98);
        }


        /* ========================= */
        /* TIKTOK - AZZURRO */
        /* ========================= */

        .tiktok {
            left: 8.5%;
            right: 8.5%;
            top: 53%;
            height: 7.8%;
        }

        .tiktok:hover {
            background: rgba(0, 242, 234, 0.22);

            box-shadow:
                0 0 10px rgba(0, 242, 234, 0.7),
                0 0 25px rgba(0, 242, 234, 0.45),
                inset 0 0 15px rgba(0, 242, 234, 0.2);

            transform: scale(1.02);
        }

        .tiktok:active {
            background: rgba(0, 242, 234, 0.38);

            box-shadow:
                0 0 15px rgba(0, 242, 234, 0.9),
                0 0 30px rgba(0, 242, 234, 0.7),
                inset 0 0 20px rgba(0, 242, 234, 0.3);

            transform: scale(0.98);
        }


        /* ========================= */
        /* FACEBOOK - BLU */
        /* ========================= */

        .facebook {
            left: 8.5%;
            right: 8.5%;
            top: 61.5%;
            height: 7.8%;
        }

        .facebook:hover {
            background: rgba(24, 119, 242, 0.25);

            box-shadow:
                0 0 10px rgba(24, 119, 242, 0.7),
                0 0 25px rgba(24, 119, 242, 0.45),
                inset 0 0 15px rgba(24, 119, 242, 0.2);

            transform: scale(1.02);
        }

        .facebook:active {
            background: rgba(24, 119, 242, 0.40);

            box-shadow:
                0 0 15px rgba(24, 119, 242, 0.9),
                0 0 30px rgba(24, 119, 242, 0.7),
                inset 0 0 20px rgba(24, 119, 242, 0.3);

            transform: scale(0.98);
        }


        /* ========================= */
        /* YOUTUBE - ROSSO */
        /* ========================= */

        .youtube {
            left: 8.5%;
            right: 8.5%;
            top: 70%;
            height: 7.8%;
        }

        .youtube:hover {
            background: rgba(255, 0, 0, 0.23);

            box-shadow:
                0 0 10px rgba(255, 0, 0, 0.7),
                0 0 25px rgba(255, 0, 0, 0.45),
                inset 0 0 15px rgba(255, 0, 0, 0.2);

            transform: scale(1.02);
        }

        .youtube:active {
            background: rgba(255, 0, 0, 0.38);

            box-shadow:
                0 0 15px rgba(255, 0, 0, 0.9),
                0 0 30px rgba(255, 0, 0, 0.7),
                inset 0 0 20px rgba(255, 0, 0, 0.3);

            transform: scale(0.98);
        }


        /* ========================= */
        /* UNISCITI AL TEAM - VERDE */
        /* ========================= */

        .join-team {
            left: 8.5%;
            right: 8.5%;
            top: 79.2%;
            height: 8.8%;
        }

        .join-team:hover {
            background: rgba(70, 150, 70, 0.25);

            box-shadow:
                0 0 10px rgba(70, 150, 70, 0.7),
                0 0 25px rgba(70, 150, 70, 0.45),
                inset 0 0 15px rgba(70, 150, 70, 0.2);

            transform: scale(1.02);
        }

        .join-team:active {
            background: rgba(70, 150, 70, 0.40);

            box-shadow:
                0 0 15px rgba(70, 150, 70, 0.9),
                0 0 30px rgba(70, 150, 70, 0.7),
                inset 0 0 20px rgba(70, 150, 70, 0.3);

            transform: scale(0.98);
        }


        /* ========================= */
        /* PULSANTE MUSICA */
        /* ========================= */

        .music-control {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 1000;

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;

            background: rgba(0, 0, 0, 0.78);
            color: #fff;

            padding: 9px 12px;

            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: 600;

            letter-spacing: 0.4px;

            cursor: pointer;

            backdrop-filter: blur(5px);

            box-shadow:
                0 3px 15px rgba(0, 0, 0, 0.5);
        }

        .music-control:active {
            transform: scale(0.96);
        }


        /* ========================= */
        /* EFFETTO TOUCH MOBILE */
        /* ========================= */

        @media (hover: none) {

            .click-area:active {
                transform: scale(0.98);
            }

        }


        /* ========================= */
        /* MOBILE */
        /* ========================= */

        @media (max-width: 600px) {

            .music-control {
                right: 10px;
                bottom: 10px;
                padding: 8px 10px;
                font-size: 11px;
            }

        }

    </style>

</head>


<body>

    <div class="homepage">

        <!-- IMMAGINE PRINCIPALE -->

        <img src="ingresso.jpeg" alt="SOAS Air Soft Team">


        <!-- INSTAGRAM -->

        <a
            href="https://www.instagram.com/soas.asd?utm_source=qr"
            class="click-area instagram"
            aria-label="Instagram SOAS">
        </a>


        <!-- TIKTOK -->

        <a
            href="https://www.tiktok.com/@soas.asd?_r=1&_t=ZN-99IF5SQS9f4"
            class="click-area tiktok"
            aria-label="TikTok SOAS">
        </a>


        <!-- FACEBOOK -->

        <a
            href="https://www.facebook.com/share/1bGvbMMJhc/?mibextid=wwXIfr"
            class="click-area facebook"
            aria-label="Facebook SOAS">
        </a>


        <!-- YOUTUBE -->

        <a
            href="https://www.youtube.com/@S.O.A.S-ASD/videos"
            class="click-area youtube"
            aria-label="YouTube SOAS">
        </a>


        <!-- UNISCITI AL TEAM -->

        <a
            href="cv.html"
            class="click-area join-team"
            aria-label="Unisciti al Team">
        </a>

    </div>


    <!-- ========================= -->
    <!-- MUSICA -->
    <!-- ========================= -->

    <audio id="bgMusic" loop preload="metadata">
        <source src="musica.mp3" type="audio/mpeg">
    </audio>


    <!-- PULSANTE MUSICA -->

    <button
        type="button"
        class="music-control"
        id="musicBtn">
        🔇 MUSICA OFF
    </button>


    <script>

        const music = document.getElementById("bgMusic");
        const musicBtn = document.getElementById("musicBtn");

        /* VOLUME 18% */

        music.volume = 0.18;


        /* ========================= */
        /* PULSANTE ON / OFF */
        /* ========================= */

        musicBtn.addEventListener("click", async function () {

            if (music.paused) {

                try {

                    await music.play();

                    musicBtn.textContent = "🔊 MUSICA ON";

                } catch (error) {

                    musicBtn.textContent = "⚠️ AUDIO";

                }

            } else {

                music.pause();

                musicBtn.textContent = "🔇 MUSICA OFF";

            }

        });


        /* ========================= */
        /* AVVIO AL PRIMO TOCCO */
        /* ========================= */

        document.addEventListener("click", function () {

            if (music.paused) {

                music.play()
                    .then(function () {

                        musicBtn.textContent = "🔊 MUSICA ON";

                    })
                    .catch(function () {

                        /* Il browser potrebbe bloccare l'autoplay */

                    });

            }

        }, { once: true });

    </script>

</body>

</html>
