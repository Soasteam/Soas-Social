<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#080808">

    <title>SOAS Air Soft Team</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;

            min-height: 100vh;

            overflow-x: hidden;
        }

        /* CONTENITORE DELLA HOMEPAGE */

        .homepage {
            position: relative;

            width: 100%;
            max-width: 972px;

            line-height: 0;
        }

        /* IMMAGINE HOMEPAGE */

        .homepage img {
            display: block;

            width: 100%;
            height: auto;
        }

        /*
        =====================================================
        ZONE CLICCABILI
        =====================================================
        */

        .click-area {
            position: absolute;

            display: block;

            z-index: 10;

            cursor: pointer;

            /*
            Durante i test puoi togliere il commento
            alla riga sotto per vedere le zone.
            */

            /* background: rgba(255, 0, 0, 0.20); */
        }

        /* INSTAGRAM */

        .instagram {
            left: 8.5%;
            right: 8.5%;

            top: 44.5%;
            height: 7.8%;
        }

        /* TIKTOK */

        .tiktok {
            left: 8.5%;
            right: 8.5%;

            top: 53%;
            height: 7.8%;
        }

        /* FACEBOOK */

        .facebook {
            left: 8.5%;
            right: 8.5%;

            top: 61.5%;
            height: 7.8%;
        }

        /* YOUTUBE */

        .youtube {
            left: 8.5%;
            right: 8.5%;

            top: 70%;
            height: 7.8%;
        }

        /* UNISCITI AL TEAM */

        .join-team {
            left: 8.5%;
            right: 8.5%;

            top: 79.2%;
            height: 8.8%;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .homepage {
                width: 100%;
            }

        }

    </style>

</head>


<body>

    <main class="homepage">

        <!-- HOMEPAGE SOAS -->

        <img
            src="ingresso.jpeg"
            alt="SOAS Air Soft Team"
        >


        <!-- INSTAGRAM -->

        <a
            class="click-area instagram"
            href="https://www.instagram.com/soas.asd?utm_source=qr"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram SOAS"
        ></a>


        <!-- TIKTOK -->

        <a
            class="click-area tiktok"
            href="https://www.tiktok.com/@soas.asd?_r=1&_t=ZN-99IF5SQS9f4"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="TikTok SOAS"
        ></a>


        <!-- FACEBOOK -->

        <a
            class="click-area facebook"
            href="https://www.facebook.com/share/1bGvbMMJhc/?mibextid=wwXIfr"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook SOAS"
        ></a>


        <!-- YOUTUBE -->

        <a
            class="click-area youtube"
            href="https://www.youtube.com/@S.O.A.S-ASD/videos"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="YouTube SOAS"
        ></a>


        <!-- UNISCITI AL TEAM -->

        <a
            class="click-area join-team"
            href="cv.html"
            aria-label="Unisciti al team"
        ></a>

    </main>

</body>

</html>
